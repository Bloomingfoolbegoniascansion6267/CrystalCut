[package]
name = "crystalcut"
version = "1.0.0"
description = "Fast local-first background removal for Windows and macOS"
authors = ["CrystalCut contributors"]
edition = "2021"

[lib]
name = "crystalcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
ndarray = "0.17"
ort = "=2.0.0-rc.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
walkdir = "2"
webp = "0.3"
