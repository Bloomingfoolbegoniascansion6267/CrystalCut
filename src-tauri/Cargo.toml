[package]
name = "crystalcut"
version = "1.0.4"
description = "Fast local-first background removal for Windows and macOS"
authors = ["CrystalCut contributors"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://pkh31337.com"
repository = "https://github.com/pkh31337/CrystalCut"

[lib]
name = "crystalcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
ndarray = "0.17"
# ort rc.11+ no longer ships x86_64-apple-darwin binaries. rc.10 is the
# newest release that supports every target in our release matrix.
ort = "=2.0.0-rc.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
walkdir = "2"
webp = "0.3"
