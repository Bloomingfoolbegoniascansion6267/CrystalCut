name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            # macos-latest is Apple Silicon. Build the Intel package natively.
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release -- ${{ github.ref_name }}

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRYSTALCUT_TAURI_BUILD: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CrystalCut v__VERSION__
          releaseBody: |
            CrystalCut 1.0.2 makes background-removal previews consistent and adopts the Apache License 2.0 for the CrystalCut source code.

            ## What's fixed

            - Background-removal and per-file edge previews now stay active whether the edge settings panel is open or closed.
            - The edge section now shows the live preview state for the selected file.
            - Preview zoom percentages now use the original image dimensions as the 100% reference.
            - Original, result, mask, and comparison tabs now keep one stable canvas size and aspect ratio.
            - Transparent pixels in the comparison result now reveal the selected preview background instead of the original image underneath.

            ## Open-source license

            CrystalCut source code is now available under the Apache License 2.0. Third-party software and AI model assets retain their own licenses and notices.

            ## Downloads

            - **Windows x64:** use `setup.exe` for a standard installation or `.msi` for managed deployment.
            - **macOS Apple Silicon:** for Macs with M1, M2, M3, M4 or newer Apple chips.
            - **macOS Intel:** for older Intel-based Macs.

            ## First AI run and privacy

            AI model files are downloaded and verified when background removal or SlimSAM object selection is used for the first time. Images are always processed locally and are not uploaded.

            ## Installation notice

            These community builds are currently unsigned. Windows SmartScreen may display a warning, and macOS Gatekeeper may require first-launch confirmation in **System Settings > Privacy & Security**.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false
          assetNamePattern: CrystalCut_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          args: ${{ matrix.args }}
