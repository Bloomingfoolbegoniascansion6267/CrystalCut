name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            # macos-latest is Apple Silicon. Build the Intel package natively.
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release -- ${{ github.ref_name }}

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 0 && "$configured" -ne "${#values[@]}" ]]; then
            echo "macOS release signing is only partially configured." >&2
            echo "Set all six Apple secrets or remove all of them to use the ad-hoc fallback." >&2
            exit 1
          fi

          if [[ "$configured" -eq 0 ]]; then
            echo "Apple credentials are absent; using the ad-hoc signing identity from tauri.conf.json."
          else
            echo "Developer ID signing and Apple notarization are enabled."
            printf '%s\n' "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRYSTALCUT_TAURI_BUILD: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CrystalCut v__VERSION__
          releaseBody: |
            CrystalCut 1.0.5 adds platform-aware AI acceleration, faster preview reuse, and a more efficient keyboard-driven editing workflow while keeping all image processing local.

            ## Highlights

            - Run ONNX inference with DirectML on Windows or CoreML on macOS, with automatic high-performance GPU selection, an isolated device test, and safe CPU fallback.
            - Reuse persisted preview results across file switches and application restarts instead of repeating identical AI inference.
            - Edit objects faster with 1–4 view switching, B/E brush selection, H or Space panning, bracket brush sizing, undo/redo, and visible shortcut hints.
            - Use consistent keyboard shortcuts and context menus for adding, selecting, reordering, rotating, exporting, and removing work-list items.
            - Work smoothly with large queues through virtualized rendering, keyboard navigation, and bounded preview-memory usage.
            - Export multiple originals or results and automatically open the appropriate output folder or folder-selection dialog.
            - Choose automatic U2NetP removal, SlimSAM-guided object selection, or a fully manual mask with clearer mode colors and edge-control availability.
            - Follow the system language automatically or choose any of nine fully translated languages.

            ## Reliability and UX fixes

            - Preview request races are discarded safely, cache keys now reflect processing inputs precisely, and cache limits prevent unbounded memory growth.
            - Switching images no longer exposes the previous image's zoom before the new fit calculation is ready.
            - Workspace persistence is serialized so reorder, rotation, edge, resize, and other rapid edits no longer produce misleading save-failure notices.
            - Object-selection controls clearly explain when edge settings are unavailable and disable sliders that cannot affect the current preview.
            - AI model installation and per-file processing failures expose actionable progress and error states.
            - macOS apps remain code-signed, DMG integrity is checked, and only a fully verified cross-platform release is published.

            ## Downloads

            - **Windows x64:** use `setup.exe` for a standard installation or `.msi` for managed deployment.
            - **macOS Apple Silicon:** for Macs with M1, M2, M3, M4 or newer Apple chips.
            - **macOS Intel:** for older Intel-based Macs.

            ## First AI run and privacy

            AI model files are downloaded and verified when background removal or SlimSAM object selection is used for the first time. Images are always processed locally and are not uploaded.

            CrystalCut source code is licensed under Apache License 2.0. Third-party software and AI model assets retain their own licenses and notices.

            ## Installation notice

            Windows SmartScreen may display a warning for unsigned Windows installers. The application inside every macOS package is code-signed; when Developer ID credentials are not configured, Gatekeeper may still require first-launch confirmation in **System Settings > Privacy & Security**.

            ## Policies

            - **Code signing policy:** https://github.com/pkh31337/CrystalCut/blob/main/CODE_SIGNING.md
            - **Privacy policy:** https://github.com/pkh31337/CrystalCut/blob/main/PRIVACY.md
            - **Third-party notices:** https://github.com/pkh31337/CrystalCut/blob/main/THIRD_PARTY_NOTICES.md
          # Keep the release private until every native package passes its
          # platform verification step below.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false
          assetNamePattern: CrystalCut_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Verify macOS application and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          shopt -s nullglob
          dmgs=("$dmg_dir"/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG in $dmg_dir; found ${#dmgs[@]}." >&2
            exit 1
          fi

          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d)"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" >/dev/null || true
            fi
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          printf 'Y\n' | hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          mounted=true
          app="$mount_dir/CrystalCut.app"
          if [[ ! -d "$app" ]]; then
            echo "CrystalCut.app is missing from the DMG." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"

          if [[ -n "$APPLE_ID" ]]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
