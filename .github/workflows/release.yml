name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            # macos-latest is Apple Silicon. Build the Intel package natively.
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release -- ${{ github.ref_name }}

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 0 && "$configured" -ne "${#values[@]}" ]]; then
            echo "macOS release signing is only partially configured." >&2
            echo "Set all six Apple secrets or remove all of them to use the ad-hoc fallback." >&2
            exit 1
          fi

          if [[ "$configured" -eq 0 ]]; then
            echo "Apple credentials are absent; using the ad-hoc signing identity from tauri.conf.json."
          else
            echo "Developer ID signing and Apple notarization are enabled."
            printf '%s\n' "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            printf '%s\n' "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRYSTALCUT_TAURI_BUILD: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CrystalCut v__VERSION__
          releaseBody: |
            CrystalCut 1.0.4 fixes macOS release installation and keeps the complete local-first background-removal and batch-conversion workflow available on both Windows and macOS.

            ## Highlights

            - Choose automatic U2NetP removal, SlimSAM-guided object selection, or a fully manual mask.
            - Refine objects with keep/remove brushes, undo/redo, and live per-file edge controls.
            - Inspect Original, Preview, Mask, and draggable Compare views with stable zoom, pan, and fit behavior.
            - Select multiple files, export their originals or results, and drag individual files or groups to reorder the queue.
            - Override the global resize for one file by setting an output width or height with the aspect ratio locked.
            - Convert without background removal and reuse complete output presets for format, quality, size, metadata, naming, and destination.
            - Review and edit selected metadata, with separate opt-in policies for GPS and generation prompts.
            - Follow the system language automatically or choose any of nine fully translated languages.

            ## Reliability and UX fixes

            - macOS apps are code-signed, DMG integrity is checked, and only a fully verified release is published.
            - Developer ID credentials automatically enable Apple notarization; otherwise a bundle-preserving ad-hoc signature is used.
            - HTTPS model downloads include the required Rustls transport instead of failing at runtime.
            - Packaged applications load bundled assets directly and no longer depend on a development server.
            - Intel macOS uses an ONNX Runtime package that provides an `x86_64-apple-darwin` binary.
            - Preview zoom uses the original dimensions as 100%, and all preview tabs retain one stable canvas and aspect ratio.
            - Removed pixels in Compare reveal transparency rather than the original image underneath.
            - Opening or closing edge settings no longer changes processing state or regenerates the preview.
            - Thumbnails preload when files are added, temporary notices dismiss automatically, and Windows release builds stay console-free.

            ## Downloads

            - **Windows x64:** use `setup.exe` for a standard installation or `.msi` for managed deployment.
            - **macOS Apple Silicon:** for Macs with M1, M2, M3, M4 or newer Apple chips.
            - **macOS Intel:** for older Intel-based Macs.

            ## First AI run and privacy

            AI model files are downloaded and verified when background removal or SlimSAM object selection is used for the first time. Images are always processed locally and are not uploaded.

            CrystalCut source code is licensed under Apache License 2.0. Third-party software and AI model assets retain their own licenses and notices.

            ## Installation notice

            Windows SmartScreen may display a warning for unsigned Windows installers. The application inside every macOS package is code-signed; when Developer ID credentials are not configured, Gatekeeper may still require first-launch confirmation in **System Settings > Privacy & Security**.
          # Keep the release private until every native package passes its
          # platform verification step below.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false
          assetNamePattern: CrystalCut_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Verify macOS application and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          shopt -s nullglob
          dmgs=("$dmg_dir"/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG in $dmg_dir; found ${#dmgs[@]}." >&2
            exit 1
          fi

          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d)"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" >/dev/null || true
            fi
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          printf 'Y\n' | hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          mounted=true
          app="$mount_dir/CrystalCut.app"
          if [[ ! -d "$app" ]]; then
            echo "CrystalCut.app is missing from the DMG." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"

          if [[ -n "$APPLE_ID" ]]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
